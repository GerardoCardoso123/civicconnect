<script>

async function findRepresentatives() {

    const location = document.getElementById("location").value.trim();
    const message = document.getElementById("message");
    const results = document.getElementById("representatives");

    if (!location) {
        message.innerHTML = "Please enter a ZIP code or address.";
        results.innerHTML = "";
        return;
    }

    message.innerHTML = "Searching...";
    results.innerHTML = "";

    // PUT YOUR 5 CALLS API TOKEN BETWEEN THE QUOTES
    const API_TOKEN = "PASTE_YOUR_5_CALLS_TOKEN_HERE";

    try {

        const response = await fetch(
            "https://api.5calls.org/v1/representatives?address=" +
            encodeURIComponent(location),
            {
                headers: {
                    "Authorization": "Bearer " + API_TOKEN,
                    "Content-Type": "application/json"
                }
            }
        );

        if (!response.ok) {
            throw new Error("API request failed: " + response.status);
        }

        const data = await response.json();

        console.log(data);

        const representatives =
            data.representatives ||
            data.results ||
            [];

        if (representatives.length === 0) {
            message.innerHTML = "No representatives found.";
            return;
        }

        message.innerHTML =
            "Representatives found for " + location;

        representatives.forEach(rep => {

            const card = document.createElement("div");
            card.className = "card";

            const name = rep.name || "Unknown";
            const party = rep.party || "Party unavailable";
            const photo = rep.photo_url || rep.photo || "";
            const website = rep.website || "";

            card.innerHTML = `
                ${
                    photo
                    ? `<img src="${photo}" alt="${name}">`
                    : ""
                }

                <h3>${name}</h3>

                <p class="party">
                    ${party}
                </p>

                ${
                    website
                    ? `<a href="${website}" target="_blank">
                        Official Website
                       </a>`
                    : ""
                }
            `;

            results.appendChild(card);
        });

    } catch (error) {

        console.error(error);

        message.innerHTML =
            "Something went wrong connecting to the representative database.";

        results.innerHTML =
            "<p>Check the browser console for the error.</p>";
    }
}

</script>
